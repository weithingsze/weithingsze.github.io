<style>
  .biobox { border-top: 1px solid var(--hairline); padding: 24px 0 4px; }
  .biobox:first-of-type { border-top: 2px solid var(--ink); }
  .biobox-head { display: flex; justify-content: space-between; align-items: baseline;
                 gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .biobox-label { font-family: 'IBM Plex Mono', monospace; font-size: .66rem;
                  letter-spacing: .17em; text-transform: uppercase; color: var(--ink); }
  .biobox-count { font-family: 'IBM Plex Mono', monospace; font-size: .64rem;
                  color: var(--muted); letter-spacing: .06em; }
  .biobox .text { max-width: 42em; }
  .biobox .text p { font-size: .97rem; line-height: 1.75; margin-bottom: 16px; }
  .biobox .text p:last-child { margin-bottom: 0; }
  .copy-btn { font-family: 'IBM Plex Mono', monospace; font-size: .62rem;
    letter-spacing: .12em; text-transform: uppercase; background: transparent;
    color: var(--muted); border: 1px solid var(--hairline); border-radius: 2px;
    padding: 6px 14px; cursor: pointer; transition: all .16s ease; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.done { background: var(--accent); border-color: var(--accent); color: #fff; }

  .kit-grid { display: grid; grid-template-columns: 200px 1fr; gap: 44px;
              align-items: start; margin-top: 40px; }
  .shot img { width: 100%; border-radius: 2px; display: block; }
  .shot .noshot { width: 100%; aspect-ratio: 1; border: 1px dashed var(--rule);
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: .8rem; padding: 18px; }
  .shot p { font-size: .74rem; color: var(--muted); margin-top: 10px;
            font-family: 'IBM Plex Mono', monospace; letter-spacing: .05em; }

  .facts-list { list-style: none; padding: 0; }
  .facts-list li { display: flex; gap: 20px; padding: 11px 0;
                   border-bottom: 1px solid var(--hairline); font-size: .91rem; }
  .facts-list li:last-child { border-bottom: none; }
  .facts-list .k { font-family: 'IBM Plex Mono', monospace; font-size: .62rem;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    min-width: 9.5em; padding-top: 4px; }

  @media (max-width: 700px) { .kit-grid { grid-template-columns: 1fr; gap: 28px; } }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var S = window.SITE || {};
  var B = S.bio || {};
  var esc = function (t) { return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  /* headshot */
  var shot = document.getElementById('shot');
  shot.innerHTML = B.headshot
    ? '<img src="' + esc(B.headshot) + '" alt="Portrait of Wei Thing Sze" ' +
      'onerror="this.parentNode.innerHTML=\'<div class=&quot;noshot&quot;>Add your photo as ' +
      esc(B.headshot) + ' in the site folder</div>\'">' +
      ''
    : '<div class="noshot">No headshot set yet</div>';

  /* quick facts organisers always ask for */
  var top = (S.education && S.education[0]) || null;
  var facts = [
    ['Full name', 'Wei Thing Sze, PhD'],
    ['Title', 'Assistant Professor'],
    ['Appointments',
      '<a href="https://www.iii.u-tokyo.ac.jp/">Interfaculty Initiative in Information Studies</a>,<br>' +
      'The University of Tokyo' +
      '<span style="display:block;margin-top:10px">Department of Health and Behavioral Informatics ' +
      '&amp; Therapeutics (HABIT) ' +
      '(<a href="https://waki-lab.jp/">Waki DTx Lab</a>),<br>' +
      'Graduate School of Medicine,<br>The University of Tokyo</span>'],
    ['Highest degree', top ? esc(top.degree) + ', ' + esc(top.institution) : null],
    ['Languages', (S.languages || []).length
      ? S.languages.map(function (l) { return esc(l.name); }).join(', ') : null],
    ['Email',
      (S.email ? '<a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a>' : '') +
      (S.emailWork ? '<br><a href="mailto:' + esc(S.emailWork) + '">' + esc(S.emailWork) + '</a>' : '')],
    ['LinkedIn', S.linkedin ? '<a href="' + esc(S.linkedin) + '">Profile</a>' : null],
    ['Research profile',
      (S.scholar ? '<a href="' + esc(S.scholar) + '">Google Scholar</a>' : '') +
      (S.researchgate ? '<br><a href="' + esc(S.researchgate) + '">ResearchGate</a>' : '') +
      (S.orcid ? '<br><a href="' + esc(S.orcid) + '">ORCID</a>' : '')]
  ].filter(function (f) { return f[1]; });

  document.getElementById('facts').innerHTML = facts.map(function (f) {
    return '<li><span class="k">' + f[0] + '</span><span>' + f[1] + '</span></li>';
  }).join('');

  /* the three bios */
  var lengths = [['long', 'Biography', '']];

  document.getElementById('bios').innerHTML = lengths.filter(function (l) { return B[l[0]]; })
    .map(function (l, i) {
      var paras = [].concat(B[l[0]]);
      return '<div class="biobox">' +
        '<div class="biobox-head">' +
          '<div><span class="biobox-label">' + l[1] + '</span></div>' +
          '<button class="copy-btn" data-i="' + i + '">Copy</button>' +
        '</div>' +
        '<div class="text" id="biotext' + i + '">' +
          paras.map(function (p) { return '<p>' + p + '</p>'; }).join('') +
        '</div>' +
      '</div>';
    }).join('');

  document.querySelectorAll('.copy-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var box = document.getElementById('biotext' + btn.getAttribute('data-i'));
      var txt = Array.prototype.map.call(box.querySelectorAll('p'), function (p) {
        return p.textContent.trim();
      }).join('\n\n') || box.textContent;
      var done = function () {
        btn.textContent = 'Copied'; btn.classList.add('done');
        setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
      };
      if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(done).catch(done); }
      else { done(); }
    });
  });
});
</script>
